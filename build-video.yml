name: Build and upload video

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON from n8n (title, description, tags, imageUrls, audioUrls, ...)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests google-api-python-client google-auth faster-whisper

      - name: Build video and upload to YouTube
        env:
          PAYLOAD: ${{ inputs.payload }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python build_video.py

      - name: Save video as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          if-no-files-found: warn
          path: |
            work/final.mp4
            work/subtitles.srt
            work/metadata.txt
          retention-days: 7
          compression-level: 0
